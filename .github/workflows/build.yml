name: Java 25 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ['26.2.build.129-stable', '26.3.build.134-beta']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Clean build and regression tests
        run: ./mvnw -B -ntp -Dpaper.version=${{ matrix.paper }} clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoarBows-${{ matrix.paper }}
          path: target/MoarBows-*.jar
          if-no-files-found: error
